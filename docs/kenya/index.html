<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Explore Kenyan publishing websites mentioning China: source counts and article links from the January 2025 GDELT pilot."><title>Kenyan sources on China · softpower-audit</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="kenya.css?v=origin-4"><script src="../audit.js" defer></script><script src="dates.js" defer></script><script src="origins.js" defer></script><script src="kenya.js?v=origin-4" defer></script></head><body>
<header class="masthead"><a class="brand" href="../">softpower-audit</a><nav aria-label="Research pages"><a href="../">All country pairs</a><a href="../pilot/">Filter comparison</a></nav></header>
<main class="kenya-main"><div class="eyebrow">LOCAL PUBLISHING WEBSITES</div><div class="title-row"><div><h1>Kenyan sources on China</h1></div></div>

<div id="status" class="status" role="status">Loading Kenyan sources…</div>
<div id="content" hidden>

<div class="source-layout"><aside class="source-sidebar" aria-label="Dates and websites"><section class="timeline-panel" aria-labelledby="timeline-title">
 <div class="timeline-heading"><div><h2 id="timeline-title">Observation date</h2></div><button id="clear-dates" class="secondary" type="button">Clear</button></div>
 <div id="date-histogram" class="date-histogram" role="img" aria-label="Daily URL counts across January 2025"></div>
 <div class="date-slider"><div class="slider-rail"></div><div id="selected-track" class="selected-track"></div><input type="range" id="range-start" min="0" max="30" step="1" value="0" aria-label="Start observation date"><input type="range" id="range-end" min="0" max="30" step="1" value="30" aria-label="End observation date"></div>
 <p id="selected-dates" class="selected-dates" role="status" aria-live="polite"></p>
 <details class="exact-dates"><summary>Exact dates</summary><form id="date-form"><label for="date-start">From<input type="date" id="date-start" required></label><label for="date-end">Through<input type="date" id="date-end" required></label><button class="secondary" type="submit">Apply dates</button></form><p id="date-error" class="date-error" role="alert" hidden></p></details>
</section>
<section class="source-panel" aria-labelledby="sources-title"><div class="source-heading"><h2 id="sources-title">Websites</h2></div><div id="source-list"></div></section>
</aside><div class="results-column"><section class="filter-panel" aria-label="Filter the collected articles"><div class="main-filters"><label for="country-source">Website country source<select id="country-source"><option value="gdelt">GDELT country</option><option value="cctld">ccTLD country</option><option value="both">GDELT + ccTLD</option></select></label><label for="mode">Geographic mentions<select id="mode"><option value="broad">China mentioned · all candidates</option><option value="both">Both China and Kenya</option><option value="only_pair">Only China and Kenya</option></select></label></div><div class="filter-options"><label><input id="place" type="checkbox">Specific Kenyan city or region detected</label><label><input id="reviewed" type="checkbox">Has an article review note</label><button id="reset" class="text-button">Reset filters</button></div></section>
<div class="results-line" role="status" aria-live="polite"><strong id="matched"></strong><span>Click a source to narrow the article list.</span></div>
<section class="articles-panel" aria-labelledby="articles-title"><div class="article-heading"><div><h2 id="articles-title">All Kenyan sources</h2><p id="article-count"></p></div><button id="export" class="secondary">Export this list ↓</button></div><p id="origin-note" class="origin-note" hidden></p><div id="active-source" hidden><button id="clear-source" class="text-button">← Show all websites</button></div><div id="article-list"></div><div class="pagination"><span id="page-label"></span><div><button id="previous" class="secondary">← Previous</button><button id="next" class="secondary">Next →</button></div></div></section></div></div>

</div></main></body></html>
