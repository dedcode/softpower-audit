<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="robots" content="noindex"><title>Downloaded article · China news audit</title>
 <link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="viewer.css?v=1">
 <script src="../config.js" defer></script><script src="viewer.js?v=1" defer></script>
</head>
<body>
 <header class="masthead"><a class="brand" href="../">China news audit</a><a id="back" href="../">← Back to results</a></header>
 <main class="reader">
  <p class="eyebrow">DOWNLOADED ARTICLE</p>
  <p id="status" role="status">Loading saved text…</p><button id="retry" class="secondary" hidden>Retry</button>
  <article id="article" hidden>
   <div class="reader-meta"><strong id="outlet"></strong><span id="quality"></span><span id="collected"></span></div>
   <h1 id="title"></h1>
   <p class="original-link"><a id="original" target="_blank" rel="noopener noreferrer">Open original article ↗</a></p>
   <p id="partial-note" class="partial-note" hidden>This extraction contains only part of the article.</p>
   <div id="text" class="article-text"></div>
  </article>
 </main>
</body>
</html>
