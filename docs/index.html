<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Browse publishing websites and their coverage of China by source country and observation date."><title>China news audit · softpower-audit</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="browser.css?v=country-browser-1"><script src="config.js" defer></script><script src="audit.js" defer></script><script src="kenya/dates.js" defer></script><script src="browser.js?v=country-browser-1" defer></script></head><body>
<header class="masthead"><a class="brand" href="./">softpower-audit</a><label class="country-heading" for="source-country">Source country<select id="source-country" aria-label="Source country" disabled><option>Loading countries…</option></select></label></header>
<main class="kenya-main"><div class="eyebrow">LOCAL PUBLISHING WEBSITES</div><div class="title-row"><div><h1 id="page-title">Sources on China</h1></div></div>

<div id="status" class="status" role="status">Loading sources…</div><button id="retry" class="secondary" hidden>Retry</button>
<div id="content" hidden>

<div class="source-layout"><aside class="source-sidebar" aria-label="Dates and websites"><section class="timeline-panel" aria-labelledby="timeline-title">
 <div class="timeline-heading"><div><h2 id="timeline-title">Observation date</h2></div><button id="clear-dates" class="secondary" type="button">Clear</button></div>
 <div id="date-histogram" class="date-histogram" role="img" aria-label="Monthly URL counts across 2015–2025"></div>
 <div class="date-slider"><div class="slider-rail"></div><div id="selected-track" class="selected-track"></div><input type="range" id="range-start" min="0" max="30" step="1" value="0" aria-label="Start observation date"><input type="range" id="range-end" min="0" max="30" step="1" value="30" aria-label="End observation date"></div>
 <p id="selected-dates" class="selected-dates" role="status" aria-live="polite"></p>
 <details class="exact-dates"><summary>Exact dates</summary><form id="date-form"><label for="date-start">From<input type="date" id="date-start" required></label><label for="date-end">Through<input type="date" id="date-end" required></label><button class="secondary" type="submit">Apply dates</button></form><p id="date-error" class="date-error" role="alert" hidden></p></details>
</section>
<section class="source-panel" aria-labelledby="sources-title"><div class="source-heading"><h2 id="sources-title">Websites</h2></div><div id="source-list"></div></section>
</aside><div class="results-column"><section class="filter-panel" aria-label="Filter the collected articles"><div class="main-filters"><label for="country-source">Website country source<select id="country-source"><option value="gdelt">GDELT country</option><option value="cctld">ccTLD country</option><option value="both">GDELT + ccTLD</option></select></label><label for="mode">Geographic mentions<select id="mode"><option value="broad">China mentioned · all candidates</option><option value="both">China and source country</option><option value="only_pair">Only China and source country</option></select></label></div><div class="filter-options"><label><input id="place" type="checkbox"><span id="place-label">Specific city or region in the source country</span></label><button id="reset" class="text-button">Reset filters</button></div></section>
<div class="results-line" role="status" aria-live="polite"><strong id="matched"></strong><span>Click a source to narrow the article list.</span></div>
<section class="articles-panel" aria-labelledby="articles-title"><div class="article-heading"><div><h2 id="articles-title">All sources</h2><p id="article-count"></p></div><button id="export" class="secondary">Export this page ↓</button></div><div id="active-source" hidden><button id="clear-source" class="text-button">← Show all websites</button></div><div id="article-list"></div><div class="pagination"><span id="page-label"></span><div><button id="previous" class="secondary">← Previous</button><button id="next" class="secondary">Next →</button></div></div></section></div></div>

</div></main></body></html>
